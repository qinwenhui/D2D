# D2D Job 配置: PostgreSQL t_src → QSDB（HTTP 服务模式）
# 用法: PG_USER=... PG_PASS=... d2d --config examples/postgres_to_qsdb_http.yaml [--dry-run]
#
# QSDB 统一以 server 模式部署：
#   qsdb server --path /var/lib/qsdb --addr 0.0.0.0:9430
# 然后 D2D 通过官方 qsdb-client 走 HTTP：
#   写 = Arrow IPC POST /api/v1/write（服务端 Qsdb::append）
#   读 = query_stream（rows 通道，客户端内存恒定）
#
# ⚠️ qsdb-client 不做 TLS：只接受 http://host:port。要加密请在 QSDB 前挂 TLS 终止代理。
# ⚠️ 进程内 embedded 模式（connection.path）已移除；配了会明确报错。

job:
  name: "postgres_to_qsdb_http"

flow:
  source:
    concurrency: 4
    pool:
      capacity: 64MB
      on_overflow: backpressure
  pipeline:
    concurrency: 4
  sink:
    concurrency: 4
    # 一份数据 = 一次 HTTP /write 请求 = 一次 QSDB 提交
    batch_bytes: 64MB
    batch_rows: 65536
    pool:
      capacity: 256MB
      on_overflow: backpressure

source:
  connector: "postgres"
  connection:
    host: "192.0.2.13"
    port: 5432
    user: "${PG_USER}"
    password: "${PG_PASS}"
  schema_name: "postgres"   # ⚠️ PostgreSQL 里这里装的是**数据库名**
  table: "src_big"
  partition:
    mode: "range"
    column: "id"
    count: 4
    lower: 1
    upper: 200000

sink:
  connector: "qsdb"
  method: "http"                  # 可省略；只给 url 时自动选 http
  connection:
    url: "http://192.0.2.20:9430"
    # Basic 认证（与 token 二选一）
    # user: "qsdb_user"
    # password: "qsdb_pass"
    # 或 Bearer（服务端 --token / auth/login 签发）
    # token: "eyJ..."
    connect_timeout_ms: 10000
    query_timeout_ms: 0           # 0/缺省 = 不设服务端超时
  database: "default"             # qsdb server 是单库服务，只能 default
  table: "dst_big"
  properties:
    create_table: true            # 表不存在时按首批 Arrow schema 自动建表
    # partition_by: ["dt"]        # QSDB 原生分区（列必须出现在批次里）
    compression: "zstd"           # zstd（缺省）| snappy

engine:
  memory_mb: 2048
