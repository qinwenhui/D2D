# D2D Job 配置: qmdb 宽表 → 达梦（DPI 数组绑定）
# 用法: QMDB_PASS=... DM_PASS=... d2d --config examples/qmdb_to_dameng.yaml [--dry-run]
#
# qmdb 的数据面是 Arrow Flight SQL（与 JDBC 驱动同一条服务端路径）：
#   读 = GetFlightInfo(CommandStatementQuery) → DoGet 逐批收 Arrow 批（列式直传）
# 目标端走达梦 DPI 直通（248MB 攒批 + param_rows 20000 的最优实测组合）。
#
# ⚠️ qmdb 表名一律全限定：source.schema_name 是库名（qmdb 是多库的）。
# ⚠️ 读侧不要对亿级大表裸跑 SELECT *：请配 partition（按 pdate 切）或 query.where_clause
#    做分区裁剪 —— 不带分区条件的全表扫是另一个量级。

job:
  name: "qmdb_to_dameng"

flow:
  source:
    concurrency: 8
    pool:
      capacity: 256MB
      on_overflow: backpressure
  pipeline:
    concurrency: 8
  sink:
    concurrency: 16
    # 一份数据 = 一次三段式装载（begin_load → do_put → commit_load）
    batch_bytes: 64MB
    batch_rows: 250000
    pool:
      capacity: 512MB
      on_overflow: backpressure

source:
  connector: "qmdb"
  method: "flight"                    # 可省略；只有这一条路
  connection:
    addr: "192.0.2.13:31337"          # Flight SQL 端点（host:port 必填）
    user: "root"
    password: "${QMDB_PASS}"
    connect_timeout_ms: 5000
  schema_name: "bench_lc"             # qmdb 的库名
  table: "dwd_wide_gen"
  partition:
    # 按 qmdb 的分区列切（pdate 全库 DATE）：分区裁剪是性能生命线
    mode: "range"
    column: "pdate"
    count: 8
    lower: "2026-10-01"
    upper: "2026-10-09"

sink:
  connector: "dameng"
  method: "dpi"                       # 数组参数绑定直通
  connection:
    dsn: "DM8SVC"
    user: "APP"
    password: "${DM_PASS}"
  database: "APP"
  table: "DWD_WIDE_GEN"
  properties:
    dpi:
      param_rows: 20000               # 每次 dpi_exec 的行数（1..=65535）

engine:
  memory_mb: 4096
