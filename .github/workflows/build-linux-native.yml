name: build-linux-native

# 面向新发行版的 Linux 原生构建（glibc 基线 = 构建机的 glibc）。
# CentOS 7 等老平台请用 build-linux-glibc217.yml 产出的包。
on:
  workflow_call:
    inputs:
      ref:
        description: "要构建的 git ref；留空则用触发本次 workflow 的 ref"
        type: string
        required: false
        default: ""
      arch:
        description: "x86_64 | aarch64"
        type: string
        required: false
        default: "x86_64"

jobs:
  build:
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Build
        run: cargo build --release --locked -p d2d-cli
      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "d2d-cli"))')
          pkg="d2d-${version}-linux-${ARCH}"
          mkdir -p "dist/${pkg}/examples"
          cp target/release/d2d "dist/${pkg}/"
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE "dist/${pkg}/"
          cp examples/*.yaml "dist/${pkg}/examples/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          rm -rf "dist/${pkg}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: d2d-linux-${{ inputs.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
