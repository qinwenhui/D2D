name: Release

on:
  push:
    tags: ["v*"]
  # 允许对已存在的 tag 补发/补全 Release（工作流本身永远取自 main）
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 tag，例如 v0.1.2"
        required: true

permissions:
  contents: write

jobs:
  linux:
    name: linux / ${{ matrix.arch }} (glibc 2.17)
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    uses: ./.github/workflows/build-linux-glibc217.yml
    with:
      ref: ${{ github.event.inputs.tag || '' }}
      arch: ${{ matrix.arch }}

  windows:
    name: windows / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || '' }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Build
        run: cargo build --release --locked -p d2d-cli
      - name: Package
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'd2d-cli' } |
            Select-Object -ExpandProperty version
          $pkg = "d2d-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkg/examples" | Out-Null
          Copy-Item "target/release/d2d.exe" "dist/$pkg/"
          Copy-Item README.md, LICENSE, LICENSE-MIT, LICENSE-APACHE "dist/$pkg/"
          Copy-Item "examples/*.yaml" "dist/$pkg/examples/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          Remove-Item -Recurse -Force "dist/$pkg"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: d2d-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # gh 需要知道仓库。只下载 artifact 的 job 里没有 checkout，
      # gh 会去跑 `git rev-parse` 而失败；显式给仓库最稳。
      GH_REPO: ${{ github.repository }}
    steps:
      # `--verify-tag` / `--generate-notes` 需要一个可用的 git 仓库和 tag
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: d2d-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.sha256
          ls -l
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          if gh release view "$TAG" >/dev/null 2>&1; then
            out=$(gh release upload "$TAG" dist/* --clobber 2>&1)
          else
            out=$(gh release create "$TAG" dist/* \
              --verify-tag \
              --title "D2D $TAG" \
              --generate-notes 2>&1)
          fi
          rc=$?
          if [ "$rc" -ne 0 ]; then
            msg=$(printf '%s' "$out" \
              | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' \
              | tr '\n' '|')
            printf '::error title=gh release failed::%s\n' "$msg"
          fi
          exit "$rc"
