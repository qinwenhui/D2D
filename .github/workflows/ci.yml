name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: windows-x86_64
            os: windows-latest
          - name: windows-aarch64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # d2d-dameng 的 ODBC 路径在 Linux 上走 `#[link(name = "odbc")]`，
      # 链接期就需要 unixODBC，哪怕本次任务不用 odbc method。
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      # 需要真库的集成测试都是 #[ignore]，CI 里不会连外部服务。
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --all-targets --locked 2>&1 | tee build.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --lib --tests --locked 2>&1 | tee test.log
      # 失败时把日志尾部转成 annotation，公开仓库也能通过 API 看到原因
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          for f in build.log test.log; do
            if [ -f "$f" ]; then
              msg=$(tail -n 40 "$f" \
                | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' -e 's/%/%25/g' \
                | tr '\n' '|')
              printf '::error title=Failure in %s::%s\n' "$f" "$msg"
            fi
          done

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      # `cargo check` 不链接最终产物，不需要 unixODBC
      - name: cargo check
        run: cargo check --workspace --locked

  # CentOS 7 = glibc 2.17 / kernel 3.10。在 ubuntu-24.04 上直接编出来的 GNU
  # 产物会引用 GLIBC_2.34+，所以发布产物必须在老基线里构建。
  # 这个 job 平时就跟着 main / PR 跑，不要只在打 tag 时才第一次执行。
  # 构建定义与 release.yml 共用 build-linux-glibc217.yml。
  centos7:
    name: build / centos7 (glibc 2.17)
    uses: ./.github/workflows/build-linux-glibc217.yml
